name: Build, smoke checks, and D7 memory report

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run project smoke checks
        run: python bench/run.py --build-only
      - name: Report one-million-element memory payloads
        run: python bench/run_memory.py --n 1000000 --out build/benchmark/memory_footprint.csv
      - name: Preserve memory report
        uses: actions/upload-artifact@v4
        with:
          name: d7-memory-report
          path: |
            build/benchmark/memory_footprint.csv
            build/benchmark/memory_footprint.environment.json

  full-scale-reproduction:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/d7-memory-footprint')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Run full-scale checks and experiments
        run: python bench/run.py --all --profile full --runs 5 --seed 20261119 --out build/benchmark/full
      - name: Preserve reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: full-scale-results
          path: build/benchmark/full/
